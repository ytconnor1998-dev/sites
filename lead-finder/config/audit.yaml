# Parked / placeholder pages → Tier A ("No real website: parked domain").
parking_hosts:
  - sedoparking.com
  - parkingcrew.net
  - bodis.com
  - dan.com
  - afternic.com
  - hugedomains.com
  - above.com
  - parklogic.com
  - undeveloped.com
parking_phrases:
  - "domain is for sale"
  - "this domain may be for sale"
  - "buy this domain"
  - "dominio in vendita"
  - "questo dominio è in vendita"
  - "domain parking"
  - "parked free"
  - "sito in costruzione"
  - "sito in allestimento"
  - "under construction"
  - "coming soon"
  - "website coming soon"
  - "this site is under construction"
  - "dominio registrato"
  - "default web site page"
  - "apache2 default page"
  - "welcome to nginx"
  - "account suspended"
  - "this account has been suspended"
min_text_chars: 80   # homepage with less visible text than this counts as a placeholder
