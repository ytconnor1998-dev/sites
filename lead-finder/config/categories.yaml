# ─────────────────────────────────────────────────────────────────────
#  BUSINESS CATEGORIES
#  Add a category by copying an entry. No code changes needed.
#
#  key (e.g. "restaurants")  used on the CLI: --categories "restaurants,b&bs"
#    name           display name (also accepted on the CLI)
#    group          one of the group keys below
#    aliases        optional extra names accepted on the CLI
#    google_types   Google Places (New) types. The first is sent as
#                   `includedType`; leave the list empty if no type fits
#                   (the text query alone is used then).
#    terms_it       Italian search terms (the first one is the primary query)
#    terms_en       English search terms (only queried if settings.yaml
#                   google.term_mode is "all")
#    osm_tags       OpenStreetMap tags; a business matches ANY of them
# ─────────────────────────────────────────────────────────────────────

groups:
  tourist-facing:
    name: Tourist-facing
    needs_english: true     # turns on the "No English version" audit check
  personal-services:
    name: Personal services
  trades:
    name: Trades
  health:
    name: Health
  other-local:
    name: Other local

categories:
  # ── Tourist-facing ────────────────────────────────────────────────
  restaurants:
    name: Restaurants
    group: tourist-facing
    google_types: [restaurant]
    terms_it: [ristorante]
    terms_en: [restaurant]
    osm_tags: [{amenity: restaurant}]
  trattorie:
    name: Trattorie
    group: tourist-facing
    aliases: [trattoria]
    google_types: [italian_restaurant]
    terms_it: [trattoria, osteria]
    terms_en: [trattoria]
    osm_tags: [{amenity: restaurant, cuisine: italian}]
  pizzerias:
    name: Pizzerias
    group: tourist-facing
    aliases: [pizzeria]
    google_types: [pizza_restaurant]
    terms_it: [pizzeria]
    terms_en: [pizzeria]
    osm_tags: [{amenity: restaurant, cuisine: pizza}, {amenity: fast_food, cuisine: pizza}]
  bars-cafes:
    name: Bars / cafés
    group: tourist-facing
    aliases: [bars, cafes, cafe, bar]
    google_types: [cafe]
    terms_it: [bar caffetteria]
    terms_en: [cafe]
    osm_tags: [{amenity: cafe}, {amenity: bar}]
  gelaterie:
    name: Gelaterie
    group: tourist-facing
    aliases: [gelateria, ice cream]
    google_types: [ice_cream_shop]
    terms_it: [gelateria]
    terms_en: [gelato]
    osm_tags: [{amenity: ice_cream}, {shop: ice_cream}]
  bnbs:
    name: B&Bs
    group: tourist-facing
    aliases: [b&b, bed and breakfast]
    google_types: [bed_and_breakfast]
    terms_it: [bed and breakfast]
    terms_en: [bed and breakfast]
    osm_tags: [{tourism: guest_house, guest_house: bed_and_breakfast}]
  guesthouses:
    name: Guesthouses
    group: tourist-facing
    aliases: [guesthouse, affittacamere]
    google_types: [guest_house]
    terms_it: [affittacamere]
    terms_en: [guesthouse]
    osm_tags: [{tourism: guest_house}]
  small-hotels:
    name: Small hotels
    group: tourist-facing
    aliases: [hotels, hotel]
    google_types: [hotel]
    terms_it: [hotel]
    terms_en: [small hotel]
    osm_tags: [{tourism: hotel}]
  souvenir-artisan:
    name: Souvenir / artisan shops
    group: tourist-facing
    aliases: [souvenir, artisan]
    google_types: [gift_shop]
    terms_it: [negozio artigianato, souvenir]
    terms_en: [souvenir shop]
    osm_tags: [{shop: gift}, {shop: craft}, {craft: "*"}]
  tour-operators:
    name: Tour operators
    group: tourist-facing
    aliases: [tours]
    google_types: [travel_agency]
    terms_it: [tour operator, visite guidate]
    terms_en: [tour operator]
    osm_tags: [{shop: travel_agency}, {office: travel_agent}, {tourism: information, information: office}]
  bike-scooter-rental:
    name: Bike / scooter rental
    group: tourist-facing
    aliases: [bike rental, scooter rental]
    google_types: []
    terms_it: [noleggio bici, noleggio scooter]
    terms_en: [bike rental]
    osm_tags: [{amenity: bicycle_rental}, {shop: rental}, {amenity: motorcycle_rental}]

  # ── Personal services ─────────────────────────────────────────────
  hair-salons:
    name: Hair salons
    group: personal-services
    aliases: [parrucchiere, hairdressers]
    google_types: [hair_salon]
    terms_it: [parrucchiere]
    terms_en: [hair salon]
    osm_tags: [{shop: hairdresser}]
  barbers:
    name: Barbers
    group: personal-services
    aliases: [barbiere, barber]
    google_types: [barber_shop]
    terms_it: [barbiere]
    terms_en: [barber]
    osm_tags: [{shop: hairdresser, male: "yes"}, {shop: barber}]
  beauty-salons:
    name: Beauty salons
    group: personal-services
    aliases: [estetista, beauty]
    google_types: [beauty_salon]
    terms_it: [centro estetico]
    terms_en: [beauty salon]
    osm_tags: [{shop: beauty}]
  nail-salons:
    name: Nail salons
    group: personal-services
    aliases: [nails]
    google_types: [nail_salon]
    terms_it: [nail salon, ricostruzione unghie]
    terms_en: [nail salon]
    osm_tags: [{shop: beauty, beauty: nails}]
  tattoo-studios:
    name: Tattoo studios
    group: personal-services
    aliases: [tattoo]
    google_types: []
    terms_it: [tatuaggi studio]
    terms_en: [tattoo studio]
    osm_tags: [{shop: tattoo}]

  # ── Trades ────────────────────────────────────────────────────────
