    google_types: [locksmith]
    terms_it: [fabbro]
    terms_en: [locksmith]
    osm_tags: [{craft: locksmith}, {shop: locksmith}]
  builders:
    name: Builders
    group: trades
    aliases: [impresa edile, builder]
    google_types: [general_contractor]
    terms_it: [impresa edile]
    terms_en: [builder]
    osm_tags: [{craft: builder}, {office: construction_company}]
  car-repair:
    name: Car repair
    group: trades
    aliases: [meccanico, officina, mechanic]
    google_types: [car_repair]
    terms_it: [officina meccanica]
    terms_en: [car repair]
    osm_tags: [{shop: car_repair}]

  # ── Health ────────────────────────────────────────────────────────
  dentists:
    name: Dentists
    group: health
    aliases: [dentista, dentist]
    google_types: [dentist]
    terms_it: [dentista]
    terms_en: [dentist]
    osm_tags: [{amenity: dentist}, {healthcare: dentist}]
  physiotherapists:
