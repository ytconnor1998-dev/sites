<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;700&family=Cinzel:wght@600;700&display=swap">
<style>
/* Layout: a parcel label as the hero, then a city price list, Roman street plaques and one purple closing band. */
:root {
  --paper: #F7F5FB; --card: #FFFFFF; --ink: #170F2E; --muted: #5E5676; --line: #DCD5EA;
  --purple: #6A2BE0; --lilac: #CDB6FF; --on-purple: #FFFFFF; --night: #170F2E; --night-fg: #F1EDFA; --night-muted: #B8B0D2;
  --marble: #F4F2EE; --marble-ink: #2A2530; --marble-line: #3A3340;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --plaque: "Cinzel", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E0A1A; --card: #1B1430; --ink: #F1EDFA; --muted: #A39BBE; --line: #2C2444; --purple: #8A55F5; --lilac: #B79BFF;
  --marble: #E6E2DC; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E0A1A; --card: #1B1430; --ink: #F1EDFA; --muted: #A39BBE; --line: #2C2444; --purple: #8A55F5; --lilac: #B79BFF;
  --marble: #E6E2DC; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select { font: inherit; color: inherit; }
a { color: var(--purple); }
:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 24px; min-height: 64px; }
.logo { font-family: var(--display); font-variation-settings: "wdth" 125; font-weight: 900; font-size: 24px; color: var(--purple); text-decoration: none; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 8px; }
.logo svg { width: 26px; height: 26px; }
.nav { display: flex; gap: 20px; font-weight: 500; }
.nav a { color: var(--ink); text-decoration: none; }
.nav a:hover { color: var(--purple); }
.right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 3px; overflow: hidden; }
.lang button { border: 0; background: none; padding: 4px 9px; font-size: 13px; font-weight: 700; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 3px; background: var(--purple); color: var(--on-purple); font-weight: 700; padding: 12px 18px; text-decoration: none; cursor: pointer; white-space: nowrap; }
@media (max-width: 860px) { .nav { display: none; } }
@media (max-width: 420px) { .top .btn { padding: 10px 12px; font-size: 15px; } .top .wrap { gap: 10px; } }

/* Hero */
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 56px; align-items: center; padding-block: 64px 72px; }
.hero h1 { font-variation-settings: "wdth" 112; font-weight: 900; font-size: clamp(46px, 6.6vw, 88px); line-height: .95; letter-spacing: -.035em; }
.hero h1 em { font-style: normal; color: var(--purple); }
.hero .lead { font-size: 20px; color: var(--muted); max-width: 40ch; margin-top: 24px; }
.hero .uses { margin-top: 28px; display: grid; gap: 6px; font-weight: 500; }
.hero .uses span::before { content: "→ "; color: var(--purple); font-weight: 700; }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 40px 56px; } }

/* The shipping label */
.label { background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 10px 10px 0 var(--lilac); transform: rotate(-1.5deg); max-width: 460px; width: 100%; justify-self: center; }
@media (max-width: 900px) { .label { transform: none; box-shadow: 6px 6px 0 var(--lilac); } }
.label-h { background: var(--purple); color: var(--on-purple); display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-family: var(--display); font-variation-settings: "wdth" 125; font-weight: 900; letter-spacing: .02em; }
.label-h small { font-family: var(--body); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.field { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; border-bottom: 2px solid var(--ink); }
.field label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 0 12px 0 16px; color: var(--muted); align-self: stretch; display: flex; align-items: center; border-right: 2px solid var(--ink); }
.field select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; padding: 14px 36px 14px 14px; font-family: var(--display); font-variation-settings: "wdth" 100; font-weight: 800; font-size: 20px; cursor: pointer; width: 100%;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(-45deg, transparent 50%, var(--ink) 50%); background-size: 7px 7px; background-position: right 20px center, right 13px center; background-repeat: no-repeat; }
.field select option { color: #170F2E; background: #fff; font-family: var(--body); font-size: 16px; }
.label-p { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: end; padding: 16px; border-bottom: 2px solid var(--ink); }
.label-p .amt { font-family: var(--display); font-variation-settings: "wdth" 112; font-weight: 900; font-size: 52px; line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.label-p .amt.empty { font-size: 22px; color: var(--muted); font-weight: 700; letter-spacing: 0; line-height: 1.2; }
.label-p .meta { font-size: 14px; color: var(--muted); }
.label-f { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; }
.code { height: 44px; flex: 1; max-width: 190px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 9px, var(--ink) 9px 12px, transparent 12px 14px); }

/* Sections */
section.s { padding-block: 72px; }
section.s + section.s { border-top: 1px solid var(--line); }
.s h2 { font-variation-settings: "wdth" 112; font-weight: 900; font-size: clamp(32px, 4.4vw, 52px); line-height: 1; letter-spacing: -.03em; margin-bottom: 20px; }
.s .intro { color: var(--muted); max-width: 60ch; margin-bottom: 28px; }
.why { font-family: var(--display); font-variation-settings: "wdth" 100; font-weight: 600; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.22; letter-spacing: -.015em; max-width: 28ch; }
.why mark { background: linear-gradient(transparent 62%, var(--lilac) 62%); color: inherit; padding: 0 2px; }
.why-more { margin-top: 24px; max-width: 62ch; color: var(--muted); font-size: 18px; }

/* Price list, set like a trattoria listino */
.listino { max-width: 820px; list-style: none; padding: 0; margin: 0; }
.listino li { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; }
.listino .what { font-weight: 700; font-size: 19px; }
.listino .route { display: block; color: var(--muted); font-size: 15px; font-weight: 500; }
.listino .dots { flex: 1; border-bottom: 2px dotted color-mix(in srgb, var(--ink) 35%, transparent); transform: translateY(-6px); min-width: 24px; }
.listino .p { font-family: var(--display); font-variation-settings: "wdth" 100; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.listino-foot { margin-top: 18px; color: var(--muted); font-size: 15px; }

/* How it works, as one paragraph */
.flow { font-size: clamp(20px, 2.2vw, 26px); line-height: 1.6; max-width: 34em; }
.flow b { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--purple); color: var(--on-purple); font-family: var(--display); font-size: .7em; vertical-align: .25em; margin-right: 6px; }

/* Roman street plaques */
.plaques { display: flex; flex-wrap: wrap; gap: 14px; }
.plaque { background: var(--marble); color: var(--marble-ink); border-radius: 3px; padding: 5px; box-shadow: 0 1px 0 rgba(0,0,0,.12), 0 6px 14px -8px rgba(23,15,46,.35); }
.plaque span { display: grid; justify-items: center; border: 1.5px solid var(--marble-line); padding: 6px 16px 7px; font-family: var(--plaque); font-weight: 700; letter-spacing: .06em; line-height: 1.1; }
.plaque small { font-size: 9px; letter-spacing: .3em; font-weight: 600; }
.plaque b { font-size: 17px; }

.biz { display: flex; flex-wrap: wrap; gap: 20px 48px; align-items: flex-end; justify-content: space-between; }
.biz p { max-width: 58ch; }
.more { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.faq { max-width: 820px; }
.faq details { border-bottom: 1px solid var(--line); padding: 16px 0; }
.faq details:first-child { border-top: 1px solid var(--line); }
.faq summary { font-weight: 700; font-size: 19px; cursor: pointer; }
.faq details p { color: var(--muted); margin-top: 8px; }

.join { background: var(--purple); color: var(--on-purple); }
.join .wrap { padding-block: 72px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; }
.join h2 { font-variation-settings: "wdth" 125; font-weight: 900; font-size: clamp(40px, 6.4vw, 84px); line-height: .92; letter-spacing: -.03em; max-width: 12ch; }
.join p { max-width: 36ch; margin-top: 14px; color: #EDE4FF; font-size: 19px; }
.join .btn { background: #fff; color: #170F2E; }

footer { background: var(--night); color: var(--night-muted); font-size: 15px; }
footer .wrap { padding-block: 40px 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; }
footer .logo { color: var(--night-fg); }
footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
footer a { color: var(--night-muted); text-decoration: none; }
footer a:hover { color: var(--night-fg); }
.note { width: 100%; font-size: 13px; border-top: 1px solid rgba(255,255,255,.14); padding-top: 16px; }
@media (prefers-reduced-motion: no-preference) { .label { transition: transform .4s ease; } .label:hover { transform: rotate(0deg); } }
</style>
