<title>DART Test Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: one live courier platform in four views. Phone apps sit in a device frame on wide
   screens and go full screen on phones; the website and admin use the full width. Purple is DART. */
:root {
  --paper: #F7F5FB;
  --paper-2: #EEE9F7;
  --card: #FFFFFF;
  --ink: #170F2E;
  --muted: #5E5677;
  --line: #DCD5EA;
  --purple: #452B94;
  --brand: #452B94;
  --purple-soft: #ECE7F8;
  --lilac: #CDB6FF;
  --on-lilac: #170F2E;
  --on-purple: #FFFFFF;
  --ok: #128A47;
  --ok-soft: #DDF3E6;
  --warn: #B86E00;
  --warn-soft: #FCEBCF;
  --bad: #C2283B;
  --bad-soft: #FBE1E4;
  --map-bg: #EFECF5;
  --map-road: #FFFFFF;
  --map-river: #C7D5F5;
  --map-park: #D8EAD9;
  --frame: #170F2E;
  --shadow: 0 30px 60px -30px rgba(30, 10, 80, .45);
  --font: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
/* Always light; dark only if a page sets data-theme="dark" */
:root[data-theme="dark"] {
  --paper: #0E0A1A; --paper-2: #161028; --card: #1B1430; --ink: #F1EDFA; --muted: #A39BBE;
  --line: #2C2444; --purple: #7B5CE0; --purple-soft: #2A1D4F; --lilac: #B79BFF;
  --ok: #4CD38A; --ok-soft: #123425; --warn: #F2B14C; --warn-soft: #3A2A10; --bad: #FF6B7D; --bad-soft: #3D1820;
  --map-bg: #1A1430; --map-road: #2D2548; --map-river: #263A6E; --map-park: #1C3328;
  --frame: #000000; --shadow: 0 30px 60px -30px rgba(0, 0, 0, .9);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
img { max-width: 100%; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.warn-t { color: var(--warn); font-weight: 600; }
.dot-new { color: var(--purple); }
#root { min-height: 100%; }
.splash { min-height: 100%; display: grid; place-items: center; color: var(--muted); padding: 40px 16px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 6px; padding: 13px 18px; font-weight: 700; font-size: 15px; background: var(--purple); color: var(--on-purple); text-decoration: none; text-align: center; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.big { padding: 16px; font-size: 16px; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 5px; }
.btn.google { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.google svg { width: 18px; height: 18px; }
.btn.apple { background: #000; color: #fff; }
.btn.apple svg { width: 18px; height: 18px; margin-top: -3px; }
.social { display: grid; gap: 10px; }
.wallet { display: inline-flex; align-items: center; gap: 2px; background: #000; color: #fff; border-radius: 5px; padding: 3px 9px; font-weight: 700; font-size: 15px; line-height: 1.3; }
.wallet svg { width: 15px; height: 15px; margin-top: -2px; }
.wallet.g { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); gap: 4px; }
.link { border: 0; background: none; color: var(--purple); font-weight: 700; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.link.left { text-align: left; }
.icon-btn { border: 0; background: var(--paper-2); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; position: relative; color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 6px; padding: 10px 12px; font-size: 15px; min-width: 0; }
.input.strong { font-weight: 800; }
.input.search { width: min(320px, 100%); }
textarea.input { resize: vertical; min-height: 60px; }
.check { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--purple); flex: none; }
.row { display: flex; gap: 10px; align-items: center; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.grid2, .grid3, .grid4 { display: grid; gap: 10px; }
/* Fields side by side share rows, so their boxes line up even when one label wraps */
.grid2 > .field, .grid3 > .field, .grid4 > .field { grid-row: span 3; grid-template-rows: subgrid; row-gap: 5px; align-content: start; }
.grid2 > .field > span, .grid3 > .field > span, .grid4 > .field > span { align-self: end; }
.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 420px) { .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.device .grid3, .device .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-warn { background: var(--warn-soft); color: var(--warn); }
.s-pur { background: var(--purple-soft); color: var(--purple); }
.s-ok { background: var(--ok-soft); color: var(--ok); }
.s-bad { background: var(--bad-soft); color: var(--bad); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg.inline { display: flex; flex-wrap: wrap; }
.seg button { border: 1.5px solid var(--line); background: var(--card); border-radius: 6px; padding: 9px 12px; font-weight: 600; font-size: 14px; }
.seg button.on { border-color: var(--purple); background: var(--purple-soft); color: var(--purple); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { border: 1.5px solid var(--line); background: var(--card); border-radius: 6px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.chipbtn.sm { padding: 5px 10px; font-size: 13px; }
.chipbtn.on { border-color: var(--purple); background: var(--purple-soft); color: var(--purple); }
.switch { width: 46px; height: 28px; border-radius: 20px; border: 0; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--ok); }
.switch.on::after { left: 21px; }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
.badge { background: var(--purple); color: #fff; font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; }
.icon-btn .badge, .tabs .badge, .bell .badge { position: absolute; top: 2px; right: 2px; }
.badge.in { position: static; }
.toast { position: fixed; left: 50%; translate: -50% 0; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 12px; font-weight: 600; z-index: 200; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; font-style: italic; letter-spacing: -.02em; font-size: 20px; text-decoration: none; color: inherit; }
.logo svg { width: 26px; height: 26px; flex: none; }
.logo small { font-style: normal; font-weight: 600; font-size: 13px; opacity: .7; letter-spacing: 0; }
.logo.xl { font-size: 30px; }
.logo.xl svg { width: 38px; height: 38px; }
.lang-sw { display: inline-flex; border: 1.5px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
.lang-sw button { border: 0; background: none; padding: 4px 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
.lang-sw button.on { background: var(--ink); color: var(--paper); }
.lang-sw.on-dark { border-color: rgba(255,255,255,.5); }
.lang-sw.on-dark button { color: rgba(255,255,255,.8); }
.lang-sw.on-dark button.on { background: #fff; color: #170F2E; }
.stage-bar .lang-sw, .row .lang-sw { margin-right: 6px; }
.mode { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 8px; background: var(--paper-2); white-space: nowrap; }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.mode.live i { background: var(--ok); }

/* Cards and lists */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.card.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 45%, var(--card)); }
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; width: 100%; color: inherit; }
.item b { font-size: 15px; overflow-wrap: anywhere; }
.item small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.item small:nth-of-type(2) { text-align: right; }
.item.req { border: 2px solid var(--purple); }
.item.job-card { background: var(--purple-soft); border-color: var(--purple); }
.pay { font-size: 18px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--ink); font-size: 16px; }
.banner { padding: 10px 12px; border-radius: 6px; background: var(--purple-soft); color: var(--purple); font-weight: 600; font-size: 14px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.note { background: var(--paper-2); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); min-width: 0; }
.kv dd { margin: 0; text-align: right; font-weight: 600; }
.kv .tot { color: var(--ink); font-weight: 800; border-top: 1px solid var(--line); padding-top: 6px; }
.price-big { font-size: 28px; font-weight: 900; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.price-big small { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.person { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 6px; background: var(--paper-2); }
.person > div { flex: 1; min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--purple-soft); color: var(--purple); display: grid; place-items: center; font-weight: 800; flex: none; }
.avatar.sm { width: 30px; height: 30px; font-size: 12px; }
.legs { display: grid; gap: 8px; }
.leg { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; }
.leg i { width: 11px; height: 11px; border-radius: 50%; border: 3px solid var(--purple); margin-top: 4px; }
.leg.drop i { border-radius: 2px; background: var(--ink); border-color: var(--ink); }
.leg small { display: block; color: var(--muted); }
.phs { display: flex; gap: 8px; flex-wrap: wrap; }
.ph { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; display: block; }
.ph.sm { width: 44px; height: 44px; }
.ph-wrap { position: relative; }
.ph-x { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); font-weight: 800; line-height: 1; }
.proof { width: 100%; border-radius: 6px; display: block; max-height: 280px; object-fit: cover; }
.file-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed var(--line); border-radius: 6px; padding: 14px; font-weight: 600; cursor: pointer; position: relative; text-align: center; }
.file-btn input, .file-mini input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file-mini { position: relative; cursor: pointer; }
.file-btn:focus-within, .file-mini:focus-within { outline: 3px solid var(--purple); outline-offset: 2px; }
.stars { display: flex; gap: 4px; }
.stars button { border: 0; background: none; font-size: 30px; line-height: 1; color: var(--line); padding: 2px; }
.stars button.on { color: var(--purple); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; gap: 2px; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 6px; padding: 12px; }
.opt span { color: var(--muted); font-size: 13px; }
.opt.on { border-color: var(--purple); background: var(--purple-soft); }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px; }
.stepper li { border-bottom: 3px solid var(--line); padding-bottom: 6px; font-weight: 600; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stepper li.on { border-color: var(--purple); color: var(--ink); }
.stepper li.done { border-color: color-mix(in srgb, var(--purple) 45%, var(--line)); }
.stepper button { border: 0; background: none; padding: 0; font-weight: inherit; color: inherit; }
.stepper li.done button { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.restart { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.edit-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.progress { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.progress i { height: 5px; border-radius: 4px; background: var(--line); }
.progress i.on { background: var(--purple); }
.status-h { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0 7px 18px; border-left: 2px solid var(--purple); position: relative; font-size: 14px; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--purple); }
.tl li.now b { color: var(--purple); }
.tl time { color: var(--muted); white-space: nowrap; }
.usage { display: grid; gap: 6px; font-size: 14px; }
.bar { height: 8px; border-radius: 6px; background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--purple); border-radius: 6px; }
.menu { display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.menu button { display: grid; grid-template-columns: minmax(0, 1fr) auto; text-align: left; gap: 2px 10px; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; }
.menu button:last-child { border-bottom: 0; }
.menu b { font-size: 15px; }
.menu span { color: var(--muted); font-size: 13px; grid-column: 1; }
.menu i { grid-row: 1 / 3; grid-column: 2; align-self: center; font-style: normal; font-size: 20px; color: var(--muted); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sec-h h3 { font-size: 17px; font-weight: 800; }
.hero-card { display: grid; gap: 4px; text-align: left; border: 0; border-radius: 8px; padding: 18px; background: var(--brand); color: #fff; position: relative; }
.hero-card b { font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: -.02em; }
.hero-card span { max-width: 32ch; color: #F1EAFF; padding-right: 36px; }
.hero-card i { position: absolute; right: 18px; top: 50%; translate: 0 -50%; font-style: normal; font-size: 28px; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.quick button { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 12px; }
.quick span { color: var(--muted); font-size: 13px; }
.online-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 8px; background: var(--paper-2); }
.online-card.on { background: var(--ok-soft); color: var(--ok); }
.online-card b { font-size: 16px; }
/* Courier earnings */
/* Period buttons: always one line; on narrow phones it scrolls sideways */
.seg.inline.earn-p { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; margin: 0 -16px 2px; padding: 0 16px 2px; scrollbar-width: none; }
.earn-p::-webkit-scrollbar { display: none; }
.earn-p button { flex: none; white-space: nowrap; border-radius: 999px; padding: 8px 14px; font-size: 14px; }
.earn-sum { gap: 0; padding: 18px 16px 12px; }
.earn-top { display: grid; grid-template-columns: 1.4fr 1fr; text-align: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.earn-top div { display: grid; gap: 2px; }
.earn-big { font-size: 38px; font-weight: 900; color: var(--purple); letter-spacing: -.03em; line-height: 1.05; }
.earn-big sup { font-size: .45em; vertical-align: top; position: relative; top: .25em; margin-left: 1px; }
.earn-top small { color: var(--muted); font-size: 14px; }
.earn-break { text-align: center; color: var(--muted); font-size: 13px; padding-top: 10px; }
.earn-break b { color: var(--ink); white-space: nowrap; }
.earn-list { display: grid; border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
.earn-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; text-align: left; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; }
.earn-row span { display: grid; gap: 2px; min-width: 0; }
.earn-row span b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.earn-row small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.earn-row i { font-style: normal; font-size: 20px; color: var(--purple); }
.earn-more { padding: 12px 14px; text-align: left; font-weight: 700; }
.earn-list .earn-row:last-of-type { border-bottom: 0; }
.earn-list .earn-more { border-top: 1px solid var(--line); }
.menu-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
.menu-row span { color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat3 div { background: var(--paper-2); border-radius: 6px; padding: 10px; display: grid; min-width: 0; }
.stat3 b { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
.stat3 small { color: var(--muted); font-size: 12px; }
.doc-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.doc-row > div { flex: 1; display: grid; }
.doc-row small { color: var(--muted); }
.doc-view { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.photo-big { display: block; width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; background: var(--paper-2); }
.phs img, img.proof, img.sig-img, .doc-view img, .doc-row img, .msg img { cursor: zoom-in; }
.doc-view img { border-radius: 10px; max-height: 200px; object-fit: contain; background: var(--paper-2); }
.faq { display: grid; gap: 8px; }
.faq details { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.faq summary { font-weight: 700; cursor: pointer; }
.faq p { color: var(--muted); margin-top: 8px; }
.reply { border-left: 3px solid var(--line); padding-left: 10px; display: grid; gap: 2px; }
.reply.staff { border-color: var(--purple); }
.reply small { color: var(--muted); }
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card.plan.on { border: 2px solid var(--purple); }
.auth { padding: 36px 20px 24px; display: grid; gap: 16px; max-width: 460px; margin: 0 auto; width: 100%; }

/* Courier offer: a pop-up card, or the full details */
/* Discounts and credit */

/* Address box with suggestions */
.field.addr { position: relative; }

/* Delivery times and routes */

.code-card > div { display: grid; grid-row: span 2; }

.code-big { font-size: 34px; font-weight: 900; letter-spacing: .14em; color: var(--purple); font-variant-numeric: tabular-nums; line-height: 1.1; }

@keyframes fade { from { opacity: 0; } }

}

  // Help
  "What can DART carry?": "Cosa può trasportare DART?", "Letters, documents, parcels of every size, furniture and large items. When you add measurements and photos, DART tells you if it fits and which vehicle is needed before you pay.": "Lettere, documenti, pacchi di ogni misura, mobili e oggetti grandi. Quando aggiungi misure e foto, DART ti dice se entra e quale veicolo serve prima di pagare.",
  "How is the price worked out?": "Come si calcola il prezzo?", "By distance between pickup and delivery, with a minimum fee. Size, weight, number of items, the vehicle needed and extra services like stairs or assembly are added on top. You see the full breakdown before you book.": "In base alla distanza tra ritiro e consegna, con un costo minimo. Misure, peso, numero di oggetti, veicolo necessario e servizi extra come scale o montaggio si aggiungono. Vedi il dettaglio completo prima di prenotare.",
  "Can I cancel?": "Posso annullare?", "Yes, free of charge until the courier collects the item. Card payments are refunded in full.": "Sì, gratis finché il corriere non ritira l'oggetto. I pagamenti con carta vengono rimborsati per intero.",
  "Do I need a business account for invoices?": "Mi serve un account aziendale per le fatture?", "No. Every delivery gets an invoice. Business features add your company details, monthly invoicing and optional plans.": "No. Ogni consegna ha la sua fattura. Le funzioni aziendali aggiungono i dati della tua attività, la fatturazione mensile e i piani facoltativi.",
  "How do business plans work?": "Come funzionano i piani aziendali?", "You pay a monthly fee for a set number of deliveries. Deliveries over the allowance, or types the plan doesn't cover, are charged separately and shown before you confirm.": "Paghi un canone mensile per un numero fisso di consegne. Le consegne oltre il limite, o i tipi non coperti dal piano, si pagano a parte e li vedi prima di confermare.",
  "Do I need an account?": "Mi serve un account?", "No. You can book and track with just your name, email and phone. An account keeps your history, saved addresses and invoices together, and lets businesses use plans.": "No. Puoi prenotare e tracciare solo con nome, email e telefono. Un account tiene insieme storico, indirizzi salvati e fatture, e permette alle aziende di usare i piani.",
  "Where can I find my tracking code?": "Dove trovo il codice di tracciamento?", "On the confirmation screen after booking. Use it with your email under Track a delivery.": "Nella schermata di conferma dopo la prenotazione. Usalo con la tua email in Traccia una consegna.",
  "Contact DART support": "Contatta l'assistenza DART", "A delivery": "Una consegna", "Payment or invoice": "Pagamento o fattura", "A courier": "Un corriere", "My account": "Il mio account", "Delivery (optional)": "Consegna (facoltativo)", "Your requests": "Le tue richieste",
  "Delivery question": "Domanda su una consegna", "About a courier": "Su un corriere", "Website question": "Domanda dal sito", "Business plans": "Piani aziendali", "Becoming a courier": "Diventare corriere", "A question": "Una domanda", "Common questions": "Domande frequenti", "Contact us": "Contattaci",
  "Already booked?": "Hai già prenotato?", "Track it with your code and email, chat with your courier, or report a problem from the delivery page.": "Tracciala con codice ed email, chatta con il corriere o segnala un problema dalla pagina della consegna.",
  "Help and contact": "Aiuto e contatti", "Use the form below and we'll reply by email.": "Usa il modulo qui sotto e ti risponderemo via email.", "Thanks, we've got your message.": "Grazie, abbiamo ricevuto il tuo messaggio.", "DART support will reply by email.": "L'assistenza DART ti risponderà via email.",
  // Website
  "How it works": "Come funziona", "Pricing": "Prezzi", "Couriers": "Corrieri", "Same-day delivery inside Rome's GRA": "Consegne in giornata dentro il GRA di Roma",
  "DART collects whatever you need moved in the city, from a signed contract to a sofa, and delivers it the same day. Add a photo and the measurements and you see the exact price before you book.": "DART ritira quello che devi spostare in città, da un contratto firmato a un divano, e lo consegna in giornata. Aggiungi una foto e le misure e vedi il prezzo esatto prima di prenotare.",
  "Pickup area": "Zona di ritiro", "Delivery area": "Zona di consegna", "Book now": "Prenota ora", "Pick two areas to see a price": "Scegli due zone per vedere il prezzo",
  "Minimum fee": "Costo minimo", "Per km": "Al km", "Largest furniture": "Mobile più grande", "To book": "Per prenotare", "No account": "Nessun account",
  "What a delivery costs": "Quanto costa una consegna", "Five real routes priced with today's rates. Distance sets the base, then size, weight, the vehicle and extras like stairs are added. VAT is included.": "Cinque percorsi reali con le tariffe di oggi. La distanza fa la base, poi si aggiungono misure, peso, veicolo ed extra come le scale. IVA inclusa.",
  "How pricing works →": "Come funzionano i prezzi →", "A signed contract": "Un contratto firmato", "A shop order": "Un ordine di un negozio", "Six moving boxes": "Sei scatoloni da trasloco", "An armchair from Porta Portese, fourth floor without a lift": "Una poltrona da Porta Portese, quarto piano senza ascensore", "A wardrobe, taken apart": "Un armadio smontato",
  "What happens after you book": "Cosa succede dopo la prenotazione", "Addresses and access": "Indirizzi e accesso", "Add the buzzer name and the floor. Plenty of palazzi in the centre have no lift: tick “Stairs, no lift” and the courier arrives ready for it.": "Aggiungi il nome sul citofono e il piano. Molti palazzi del centro non hanno ascensore: spunta “Scale, senza ascensore” e il corriere arriva preparato.",
  "Photo and size": "Foto e misure", "Measure the longest side, the width and the height. If you only have a photo, DART can suggest the size from it, and you check the numbers.": "Misura il lato più lungo, la larghezza e l'altezza. Se hai solo una foto, DART può suggerire le misure e tu le controlli.",
  "The right vehicle": "Il veicolo giusto", "DART picks the smallest vehicle the item fits in: a bicycle for an envelope, a van for a wardrobe. Couriers only see jobs their vehicle can carry.": "DART sceglie il veicolo più piccolo in cui l'oggetto entra: una bici per una busta, un furgone per un armadio. I corrieri vedono solo i lavori che il loro veicolo può portare.",
  "Tracking and proof": "Tracciamento e prova", "You get an update at pickup, when it's on the way and at the door, with a photo of where it was left and an invoice straight after.": "Ricevi un aggiornamento al ritiro, durante il viaggio e alla porta, con una foto di dove è stato lasciato e subito dopo la fattura.",
  "Monthly plans for shops and offices": "Piani mensili per negozi e uffici", "Use your normal DART account. Switch it to business in Settings, add your Partita IVA and SDI code, and pick a plan. Anything a plan doesn't cover is charged at the normal price, shown before you confirm.": "Usa il tuo normale account DART. Passalo ad aziendale in Impostazioni, aggiungi Partita IVA e codice SDI e scegli un piano. Ciò che il piano non copre si paga al prezzo normale, mostrato prima di confermare.",
  "Per month": "Al mese", "Each extra": "Ogni extra", "Plans will be listed here. Until then, businesses pay per delivery.": "Qui verranno elencati i piani. Fino ad allora le aziende pagano per consegna.",
  "Deliver with DART": "Consegna con DART", "Courier details": "Dettagli per i corrieri", "Apply now →": "Candidati ora →", "Register a bicycle, scooter, motorbike, car or van. For motor vehicles we check your licence, insurance and libretto before your first job.": "Registra una bici, uno scooter, una moto, un'auto o un furgone. Per i veicoli a motore controlliamo patente, assicurazione e libretto prima del primo lavoro.",
  "Where we deliver": "Dove consegniamo", "Anywhere inside the Grande Raccordo Anulare. These are the areas you can choose when booking:": "Ovunque dentro il Grande Raccordo Anulare. Queste sono le zone che puoi scegliere quando prenoti:",
  "Questions": "Domande", "More answers and contact →": "Altre risposte e contatti →", "Same-day delivery inside Rome’s GRA, from envelopes to wardrobes.": "Consegne in giornata dentro il GRA di Roma, dalle buste agli armadi.",
  "Work with DART": "Lavora con DART", "Become a courier": "Diventa corriere", "Apply to deliver": "Candidati come corriere", "Courier app log in": "Accesso app corrieri", "Terms and conditions": "Termini e condizioni", "Privacy policy": "Informativa sulla privacy", "Test build · this browser only": "Versione di prova · solo questo browser", "Test build · live data": "Versione di prova · dati dal vivo",
  "What happens when you book": "Cosa succede quando prenoti", "DART matches your item to a courier whose vehicle can carry it. This is the whole process, start to finish.": "DART abbina il tuo oggetto a un corriere con un veicolo adatto. Ecco tutto il processo, dall'inizio alla fine.",
  "Add the addresses": "Aggiungi gli indirizzi", "Choose the area and street for pickup and delivery. Add instructions like the buzzer name, the floor, or the seller's name if you're collecting something you bought.": "Scegli zona e via per ritiro e consegna. Aggiungi istruzioni come il nome sul citofono, il piano o il nome del venditore se stai ritirando qualcosa che hai comprato.",
  "Describe the item": "Descrivi l'oggetto", "Choose letter, parcel, furniture or something else. Add up to three photos and the length, width, height and weight if you know it.": "Scegli lettera, pacco, mobile o altro. Aggiungi fino a tre foto e lunghezza, larghezza, altezza e peso se lo sai.",
  "DART checks it fits": "DART controlla che entri", "We find the item's size category, the vehicles that can carry it, and whether it needs two people. If nothing can carry it, you're told before paying.": "Troviamo la categoria di misura, i veicoli che possono portarlo e se servono due persone. Se nessuno può portarlo, lo sai prima di pagare.",
  "See the full price": "Vedi il prezzo completo", "A distance charge, the size category fee, any weight or extra-item charges, the vehicle, and the extras you ticked. Every line is shown.": "Un costo per la distanza, il costo della categoria, eventuali costi per peso o oggetti extra, il veicolo e gli extra scelti. Ogni voce è visibile.",
  "Book": "Prenota", "Pay by card. Guests only need a name, email and phone number. Businesses on a plan use their monthly allowance.": "Paghi con carta. Agli ospiti bastano nome, email e telefono. Le aziende con un piano usano le consegne mensili incluse.",
  "A courier accepts": "Un corriere accetta", "Nearby couriers with a suitable vehicle see the request. When one accepts, you see their name and vehicle and can message them.": "I corrieri vicini con un veicolo adatto vedono la richiesta. Quando uno accetta, vedi nome e veicolo e puoi scrivergli.",
  "Follow it": "Seguila", "Travelling to pickup, collected, in transit, arrived. You get a notification at each step.": "Verso il ritiro, ritirato, in viaggio, arrivato. Ricevi una notifica a ogni passaggio.",
  "The courier records who received it and adds a photo. Your invoice is ready straight away.": "Il corriere registra chi l'ha ricevuto e aggiunge una foto. La fattura è pronta subito.",
  "Every delivery has a distance charge with a minimum fee. Size, weight and extras are added on top, and you see each line before you book.": "Ogni consegna ha un costo per la distanza con un minimo. Misure, peso ed extra si aggiungono, e vedi ogni voce prima di prenotare.",
  "Shortest charged trip": "Tragitto minimo addebitato", "VAT": "IVA", "Size categories": "Categorie di misura", "Your item goes in the smallest category it fits, by its three dimensions and its weight.": "Il tuo oggetto va nella categoria più piccola in cui entra, per le tre dimensioni e il peso.",
  "Category": "Categoria", "Up to": "Fino a", "Weight up to": "Peso fino a", "Category fee": "Costo categoria", "Vehicles": "Veicoli", "Extras": "Extra", "Each extra item in the same delivery": "Ogni oggetto in più nella stessa consegna", "Second courier, when needed": "Secondo corriere, quando serve", "Try a route": "Prova un percorso",
  "DART for shops, offices and studios": "DART per negozi, uffici e studi", "Send documents, stock and supplies across Rome from the account you already use. There's no separate business app.": "Invia documenti, merce e forniture in tutta Roma dall'account che usi già. Non c'è un'app separata per le aziende.",
  "Switch my account to business": "Passa il mio account ad aziendale", "Create a DART account": "Crea un account DART", "Or log in to the one you have.": "Oppure accedi a quello che hai.",
  "In Settings, add your business name, address, Partita IVA and SDI code. Your invoices show them from then on.": "In Impostazioni, aggiungi ragione sociale, indirizzo, Partita IVA e codice SDI. Da lì in poi compaiono sulle fatture.",
  "Choose a plan, or don't": "Scegli un piano, o no", "A plan gives you a set number of deliveries each month for one price. Without one, you pay per delivery.": "Un piano ti dà un numero fisso di consegne al mese a un prezzo unico. Senza piano, paghi per consegna.",
  "Book deliveries one at a time, or, on plans that include it, upload a CSV or Excel file and book every row at once.": "Prenota una consegna alla volta oppure, con i piani che lo includono, carica un file CSV o Excel e prenota tutte le righe insieme.",
  "Deliveries included": "Consegne incluse", "Each extra delivery": "Ogni consegna in più", "Bulk upload": "Caricamento multiplo", "Categories a plan doesn't cover, such as furniture, are charged at the normal price. The app shows this before you confirm.": "Le categorie non coperte dal piano, come i mobili, si pagano al prezzo normale. L'app lo mostra prima di confermare.",
  "Plans will be listed here. You can already use DART as a business and pay per delivery.": "Qui verranno elencati i piani. Puoi già usare DART come azienda e pagare per consegna.",
  "Use your own bicycle, scooter, motorbike, car or van to deliver across Rome. You choose when you work, and you only get jobs your vehicle can carry.": "Usa la tua bici, scooter, moto, auto o furgone per consegnare a Roma. Scegli tu quando lavorare e ricevi solo lavori che il tuo veicolo può portare.",
  "You keep": "Ti spetta", "Every Monday": "Ogni lunedì", "Your choice": "Decidi tu", "Inside the GRA": "Dentro il GRA", "What you earn": "Quanto guadagni",
  "Each job shows its pay before you accept. These are typical jobs for each vehicle, worked out with today's prices.": "Ogni lavoro mostra il compenso prima di accettare. Ecco lavori tipici per ogni veicolo, calcolati con i prezzi di oggi.",
  "Typical job": "Lavoro tipico", "You earn": "Guadagni", "Contract": "Contratto", "Shop order": "Ordine di un negozio", "Shoebox parcel": "Pacco formato scarpe", "Two boxes": "Due scatole", "Armchair": "Poltrona", "Sofa, three seats": "Divano a tre posti", "Small office move": "Piccolo trasloco d'ufficio",
  "Bigger vehicles also see smaller jobs. Furniture and heavy items pay more, and some need two people.": "I veicoli più grandi vedono anche i lavori più piccoli. Mobili e oggetti pesanti pagano di più, e alcuni richiedono due persone.",
  "From application to first job": "Dalla candidatura al primo lavoro", "Start your application": "Inizia la candidatura", "Apply online": "Candidati online",
  "Your name, phone and address, your vehicle with its loading space and weight limit, photos of your documents, and the IBAN you want to be paid to. It takes about ten minutes.": "Nome, telefono e indirizzo, il tuo veicolo con spazio di carico e portata, le foto dei documenti e l'IBAN su cui vuoi essere pagato. Ci vogliono circa dieci minuti.",
  "We check your documents": "Controlliamo i documenti", "DART reviews your identity and, for motor vehicles, your licence, insurance and libretto. You'll get a notification when you're approved, or a note telling you what to fix.": "DART verifica la tua identità e, per i veicoli a motore, patente, assicurazione e libretto. Riceverai una notifica quando sei approvato, oppure una nota su cosa sistemare.",
  "Go online in the courier app": "Vai online nell'app corrieri", "Switch to online and set the area you're in. Requests that fit your vehicle appear, nearest first.": "Passa a online e imposta la zona in cui sei. Compaiono le richieste adatte al tuo veicolo, prima le più vicine.",
  "Take a job": "Accetta un lavoro", "You see the pickup, the destination, the item with its size, weight and photos, any extras like stairs, and what you'll earn. Accept or decline.": "Vedi ritiro, destinazione, l'oggetto con misure, peso e foto, eventuali extra come le scale e quanto guadagnerai. Accetta o rifiuta.",
  "Deliver": "Consegna", "Navigate with Google Maps, update each step, message the customer if you need to, and finish with a photo and the name of who received it.": "Naviga con Google Maps, aggiorna ogni passaggio, scrivi al cliente se serve e concludi con una foto e il nome di chi l'ha ricevuto.",
  "Get paid": "Ricevi il pagamento", "Completed jobs show as pending in Earnings and are paid every Monday by bank transfer.": "I lavori completati compaiono come in attesa in Guadagni e vengono pagati ogni lunedì con bonifico.",
  "What you need": "Cosa ti serve", "Typical loading space": "Spazio di carico tipico", "Can carry": "Può portare", "ID, driving licence, insurance, libretto": "Documento, patente, assicurazione, libretto",
  "A smartphone with mobile data, for the courier app and photos": "Uno smartphone con dati mobili, per l'app corrieri e le foto", "An Italian or EU bank account (IBAN) for payouts": "Un conto italiano o UE (IBAN) per i pagamenti", "Your own vehicle insurance for motor vehicles": "La tua assicurazione per i veicoli a motore", "You must be 18 or over": "Devi avere almeno 18 anni",
  "Courier questions": "Domande dei corrieri", "Do I have to work set hours?": "Devo lavorare in orari fissi?", "No. You go online when you want to take jobs and offline when you don't. There are no shifts.": "No. Vai online quando vuoi lavorare e offline quando non vuoi. Non ci sono turni.",
  "Why don't I see every request?": "Perché non vedo tutte le richieste?", "DART only shows you items that fit your registered vehicle's loading space and weight limit. Bigger vehicles see smaller jobs too.": "DART ti mostra solo oggetti che entrano nello spazio di carico e nella portata del tuo veicolo. I veicoli più grandi vedono anche i lavori più piccoli.",
  "Can I change my vehicle later?": "Posso cambiare veicolo in seguito?", "Yes. Send the new vehicle from the courier app. DART approves it, and you keep getting jobs for your current vehicle until then.": "Sì. Invia il nuovo veicolo dall'app corrieri. DART lo approva e fino ad allora continui a ricevere lavori per il veicolo attuale.",
  "What if something goes wrong on a job?": "E se qualcosa va storto durante un lavoro?", "Use Report a problem on the delivery. DART support sees it straight away, and the customer is told there's an issue.": "Usa Segnala un problema sulla consegna. L'assistenza DART lo vede subito e il cliente viene avvisato.",
  "How am I paid and taxed?": "Come vengo pagato e tassato?", "Earnings are paid every Monday to your IBAN. You work as an independent courier and are responsible for your own tax position. We'll confirm the contract terms with you before your first job.": "I guadagni vengono pagati ogni lunedì sul tuo IBAN. Lavori come corriere indipendente e sei responsabile della tua posizione fiscale. Confermeremo con te le condizioni del contratto prima del primo lavoro.",
  "Can I give a job back?": "Posso restituire un lavoro?", "Yes, before you collect the item. It goes back to other couriers. Doing it often may affect your account.": "Sì, prima di ritirare l'oggetto. Torna agli altri corrieri. Farlo spesso può influire sul tuo account.",
  "Ready to apply?": "Pronto a candidarti?", "The application takes about ten minutes. Have your documents and IBAN to hand.": "La candidatura richiede circa dieci minuti. Tieni a portata di mano documenti e IBAN.", "Already applied? Open the": "Ti sei già candidato? Apri l'", "courier app": "app corrieri", "and log in with your email.": "e accedi con la tua email.",
  "Apply": "Candidatura", "Apply to deliver with DART": "Candidati per consegnare con DART", "About you": "Su di te", "Your vehicle": "Il tuo veicolo", "Payouts": "Pagamenti", "Name, contact details and address": "Nome, contatti e indirizzo", "Type, plate and loading space": "Tipo, targa e spazio di carico", "Photos of ID and vehicle papers": "Foto del documento e dei documenti del veicolo", "Your IBAN for weekly payouts": "Il tuo IBAN per i pagamenti settimanali",
  "Want the details first? Read": "Vuoi prima i dettagli? Leggi", "what being a DART courier involves": "cosa significa essere un corriere DART", "Open the courier app": "Apri l'app corrieri", "Open the courier app, go online and start taking jobs.": "Apri l'app corrieri, vai online e inizia a lavorare.",
  "We're checking your application": "Stiamo controllando la tua candidatura", "You'll get a notification in the courier app when you're approved, or a note telling you what to fix.": "Riceverai una notifica nell'app corrieri quando sei approvato, oppure una nota su cosa sistemare.", "You're approved": "Sei stato approvato", "Your application wasn't approved": "La tua candidatura non è stata approvata", "Contact DART support to find out why.": "Contatta l'assistenza DART per sapere perché.", "Your account is paused": "Il tuo account è sospeso", "Application received": "Candidatura ricevuta",
  "Street, number, CAP": "Via, numero, CAP", "Home address": "Indirizzo di casa", "Test build: not stored.": "Versione di prova: non salvata.", "Next: your vehicle": "Avanti: il tuo veicolo", "Next: documents": "Avanti: documenti", "Next: payouts": "Avanti: pagamenti", "Next: payout details": "Avanti: dati per i pagamenti",
  "Where should we pay you?": "Dove dobbiamo pagarti?", "Earnings are paid every Monday by bank transfer.": "I guadagni vengono pagati ogni lunedì con bonifico.", "Account holder": "Intestatario", "IBAN": "IBAN", "Send my application": "Invia la candidatura",
  "Terms": "Termini", "Privacy": "Privacy", "Draft for the test build. Replace with text reviewed by a lawyer before launch.": "Bozza per la versione di prova. Da sostituire con un testo rivisto da un avvocato prima del lancio.",
  "Who we are": "Chi siamo", "Bookings": "Prenotazioni", "A booking is confirmed when you pay or, for businesses on a plan or monthly invoicing, when you confirm it. The price shown before you confirm is the price you pay, unless the item turns out to be different from what you described.": "Una prenotazione è confermata quando paghi o, per le aziende con piano o fatturazione mensile, quando la confermi. Il prezzo mostrato prima della conferma è quello che paghi, a meno che l'oggetto non sia diverso da come lo hai descritto.",
  "What you can send": "Cosa puoi spedire", "Letters, documents, parcels and furniture that you're allowed to send. We don't carry cash, weapons, illegal items, prescription medicines, or alcohol for anyone under 18.": "Lettere, documenti, pacchi e mobili che puoi legalmente spedire. Non trasportiamo contanti, armi, oggetti illegali, farmaci con ricetta né alcolici per minori di 18 anni.",
  "Cancellations and refunds": "Annullamenti e rimborsi", "You can cancel free of charge until the courier collects the item. Card payments are refunded in full.": "Puoi annullare gratis finché il corriere non ritira l'oggetto. I pagamenti con carta vengono rimborsati per intero.",
  "Plans renew monthly until you cancel. Cancelling stops the next renewal; your allowance stays until the end of the period.": "I piani si rinnovano ogni mese finché non li disdici. La disdetta ferma il rinnovo successivo; le consegne incluse restano fino alla fine del periodo.",
  "Couriers are independent and approved by DART after checking their identity, vehicle and documents.": "I corrieri sono indipendenti e vengono approvati da DART dopo la verifica di identità, veicolo e documenti.",
  "What we collect": "Cosa raccogliamo", "Your name, email, phone number, addresses, item details and photos, payment status, messages with your courier, and delivery history. For couriers, also identity and vehicle documents and payout details.": "Nome, email, telefono, indirizzi, dettagli e foto degli oggetti, stato dei pagamenti, messaggi con il corriere e storico delle consegne. Per i corrieri anche documenti d'identità e del veicolo e dati per i pagamenti.",
  "Why": "Perché", "To arrange and complete deliveries, take payment, issue invoices, provide support, and keep the service safe.": "Per organizzare e completare le consegne, incassare i pagamenti, emettere fatture, offrire assistenza e mantenere il servizio sicuro.",
  "Who sees it": "Chi li vede", "Your courier sees what they need for your delivery. DART support can see messages only when a problem is reported. We use payment and hosting providers who process data for us.": "Il corriere vede ciò che gli serve per la consegna. L'assistenza DART può vedere i messaggi solo quando viene segnalato un problema. Usiamo fornitori di pagamento e hosting che trattano i dati per nostro conto.",
  "How long we keep it": "Per quanto li conserviamo", "As long as your account is open, and invoices for as long as Italian tax law requires.": "Finché il tuo account è aperto, e le fatture per il tempo previsto dalla legge fiscale italiana.",
  "Your rights": "I tuoi diritti", "Under GDPR you can ask to see, correct, export or delete your data, using the contact form on the Help page.": "In base al GDPR puoi chiedere di vedere, correggere, esportare o cancellare i tuoi dati, usando il modulo di contatto nella pagina Aiuto.",

function wire() {
  // Keep the DOM still between press and release so a tap right after typing isn't lost.
  // Any tap after the picker has closed means it was cancelled: let the screen move again.
  document.addEventListener("pointerdown", function () { if (picking && Date.now() - picking > 1000) { picking = 0; if (heldRender) { heldRender = false; setTimeout(render, 0); } } }, true);
  root.addEventListener("pointerdown", function (e) { if (e.target.closest("button, [data-act], label, a")) { holdRender = true; setTimeout(function () { if (holdRender) { holdRender = false; if (heldRender) { heldRender = false; render(); } } }, 1500); } }, true);
  document.addEventListener("pointerup", release, true);
  document.addEventListener("pointercancel", release, true);
  // Photo buttons get their own listener when tapped, so the photo still arrives if the screen was redrawn meanwhile.
  root.addEventListener("click", function (e) {
    var el = e.target;
    if (el.tagName !== "INPUT" || el.type !== "file") return;
    picking = Date.now();
    if (!el._wired) { el._wired = true; el.addEventListener("change", onFile); }
  }, true);
  // Back from the picker without a photo: stop holding the screen.
  function pickerBack() { if (picking) setTimeout(function () { if (picking && Date.now() - picking > 2500) { picking = 0; if (heldRender) { heldRender = false; render(); } } }, 3000); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pickerBack(); });
  window.addEventListener("focus", pickerBack);
  root.addEventListener("click", function (e) {
    // Photos (items, pickup and delivery proof, signatures, documents, chat) open full size.
    var img = e.target.tagName === "IMG" && e.target.closest(".phs, .proof, .sig-img, .doc-view, .doc-row, .msg, .ph-wrap") ? e.target : null;
    if (img && !img.closest(".modal") && safeImg(img.getAttribute("src"))) { S.modal = { kind: "photo", src: img.getAttribute("src"), alt: img.getAttribute("alt") || "" }; render(); return; }
    var el = e.target.closest("[data-act]");
    if (!el || !root.contains(el)) return;
    if (el.classList.contains("modal-bg") && e.target !== el) return;
    if (el.tagName === "A" && el.getAttribute("href")) return;
    var f = ACT[el.dataset.act]; if (!f) return;
    e.preventDefault(); f(el.dataset, el);
  });
  root.addEventListener("input", function (e) { if (e.target.type !== "checkbox" && e.target.tagName !== "SELECT") bindValue(e.target); });
  root.addEventListener("change", function (e) {
    var el = e.target;
    if (el.type === "file") { if (el._wired) return; var file = el.files && el.files[0], h = FILES[el.dataset.file]; if (file && h) h(file, el); el.value = ""; return; }
    if (el.dataset.onchange && ACT[el.dataset.onchange]) { ACT[el.dataset.onchange]({ v: el.value }, el); return; }
    // Redraw after focus has moved on, so the field being typed into next isn't replaced.
    if (bindValue(el) && (el.dataset.live || el.tagName === "SELECT" || el.type === "checkbox")) setTimeout(render, 0);
  });
  root.addEventListener("submit", function (e) {
    var f = e.target, h = FORMS[f.dataset.form]; if (!h) return;
    e.preventDefault();
    f.querySelectorAll("[data-bind]").forEach(bindValue);
    if (document.activeElement && f.contains(document.activeElement)) document.activeElement.blur();
    h(f);
    if (pending) render();
  });
  root.addEventListener("focusout", function () { setTimeout(function () { if (pending) render(); }, 0); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.modal) { ACT["modal-close"](); } });
  window.addEventListener("hashchange", function () { S.modal = null; closeChat(); render(); window.scrollTo(0, 0); });
  // Hand waiting deliveries to couriers one at a time, and keep an open offer's timer moving.
  setInterval(function () {
    var r = route();
    if (r === "courier" || r === "admin") dispatch();
    if (r === "courier" && myOffer() && !pending && !S.modal) render();
  }, 1000);
  // Keep simulated courier movement and relative times fresh on live views.
  setInterval(function () {
    var r = route();
    if (S.modal || pending) return;
    if ((r === "customer" || r === "web") && S.c.view === "order" || r === "courier" && S.d.view === "job" || r === "admin" && S.a.tab === "dash") render();
  }, 4000);
}

function subscribeAll() {
  ["orders", "accounts", "couriers", "invoices", "tickets", "plans"].forEach(function (col) {
    Store.watch(col, function (rows) {
      // Skip records left by the first test build, which used a simpler format.
      if (col === "orders") rows = rows.filter(function (o) { return o.cls && o.pickup && o.dropoff && o.price && o.customer; });
      if (col === "couriers") rows = rows.filter(function (c) { return c.email && c.vehicle && typeof c.vehicle === "object"; });
      if (col === "accounts") rows = rows.filter(function (a) { return a.email && a.name; });
      if (col === "orders") rows.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      S[col] = rows;
      if (col === "accounts" && S.me.customerId) { var acc = byId(rows, S.me.customerId); if (acc) checkRenewal(acc); }
      render();
    });
  });
  Store.watch("config", function (rows) {
    ["rules", "pricing", "settings", "discounts"].forEach(function (k) { var r = byId(rows, k); if (r) { r = Object.assign({}, r); delete r.id; } S.cfg[k] = r; });
    render();
  });
}

(function boot() {
  root = document.getElementById("root");
  try { if (localStorage.getItem("dart-i18n-collect")) { MISS = {}; window.__dartMiss = function () { return MISS; }; window.__dartAct = function (n, d) { ACT[n](d || {}); }; window.__dartModal = function (m) { S.modal = m; render(); }; window.__dartEval = function (src) { return eval(src); }; } } catch (e) { }
  wire(); subscribeAll();
  var settled = false;
  function go(mode, db) {
    if (settled && !(mode === "live" && Store.mode === "local")) return;
    settled = true; Store.start(mode, db); render();
  }
  if (LIVE) { liveStart(go); return; }
  setTimeout(function () { go("local"); }, 3000);
  var c = window.claude;
  if (!c || !c.use) { go("local"); return; }
  c.use("db").then(function (db) { db ? go("live", db) : go("local"); }, function () { go("local"); });
  c.use("downloads").then(function (d) { Caps.downloads = d; }, function () { });
  c.use("sample").then(function (s) {
    if (!s) return; Caps.sample = s;
    return s.limits().then(function (l) { Caps.sampleImages = !!(l && l.images); render(); }, function () { });
  }, function () { });
})();

// Phone back button and back swipe (called by the apps): close what's open, or go back one screen.
// Returns false on a main screen, so the app closes as phone apps normally do.
// Lets the phone apps show a message in the page.
window.DART_TOAST = function (m) { toast(String(m || "")); };
window.DART_BACK = function () {
  var bg = document.querySelector(".modal-bg"); if (bg) { bg.click(); return true; }
  if (S.d.offerMore) { S.d.offerMore = null; render(); return true; }
  var root = document.querySelector(".device") || document.body;
  var back = [].slice.call(root.querySelectorAll("button")).filter(function (b) { return /^\s*←/.test(b.textContent) && b.offsetParent !== null && !b.disabled; })[0];
  if (back) { back.click(); return true; }
  var r = route(), st = r === "customer" ? S.c : r === "courier" ? S.d : null;
  if (st && st.navOpen) { st.navOpen = false; render(); return true; }
  if (st && st.view && st.view !== "home") { ACT[r === "customer" ? "c-go" : "d-go"]({ v: "home" }); return true; }
  return false;
};

})();
</script>
